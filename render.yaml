services:
  - type: web
    name: family-academy-admin
    runtime: static
    repo: https://github.com/kalaabalb/family-academy-admin
    buildCommand: npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /static/js/*.js
        name: Content-Type
        value: application/javascript
      - path: /static/css/*.css
        name: Content-Type
        value: text/css
    routes:
      - type: rewrite
        source: /*
        destination: /index.html