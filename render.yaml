services:
  - type: web
    name: family-academy-admin
    runtime: static
    repo: https://github.com/kalaabalb/family-academy-admin
    buildCommand: npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /static/js/*.js
        name: Content-Type
        value: application/javascript
      - path: /static/css/*.css
        name: Content-Type
        value: text/css
      - path: /static/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: REACT_APP_API_URL
        value: https://family-academy-backend-a12l.onrender.com/api/v1



